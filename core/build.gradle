plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management'
}

java {
    sourceCompatibility = '21'
}

bootJar {
    enabled = false
}
jar {
    enabled = true
}

dependencies {
    // Ferramentas herdadas automaticamente pelas APIs (Admin e Mobile)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    api 'org.mapstruct:mapstruct:1.5.5.Final'

    // 🟢 CORREÇÃO: Apenas o core é necessário no Spring Boot 3.2
    api 'org.flywaydb:flyway-core'

    // 🚀 NOVAS DEPENDÊNCIAS: Mensageria Assíncrona e Blindagem
    api 'org.springframework.boot:spring-boot-starter-amqp'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // 🚀 NOVO: Redis para Cache de Alta Performance (Fase 2)
    api 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok'

    // O driver do banco continua escondido
    runtimeOnly 'org.postgresql:postgresql'
}