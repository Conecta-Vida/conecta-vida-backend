# Configuração exclusiva da Mobile API.
# Segredos e credenciais são fornecidos pelo ambiente (Railway ou ambiente local).
spring.application.name=conectaavida-mobile-api
server.port=${PORT:8081}

# Supabase PostgreSQL: informe DATABASE_URL com sslmode=require.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Banco existente: valida o schema sem executar alterações automáticas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=true

# Java 21
spring.threads.virtual.enabled=true

# Compartilhado com a Admin API: deve ser o mesmo salt efetivo.
app.security.salt=${CONECTA_API_SALT}
# Segredo exclusivo da Mobile API.
app.security.jwt-secret=${CONECTA_JWT_SECRET}
app.security.allowed-origins=${CONECTA_MOBILE_CORS_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}

# O módulo mobile não precisa iniciar listeners RabbitMQ.
spring.rabbitmq.listener.simple.auto-startup=false

# Health check sem expor detalhes internos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
