# Configuração exclusiva da Mobile API.
# As credenciais são injetadas pelo ambiente local, nunca versionadas.
spring.application.name=conectaavida-mobile-api
server.port=${PORT:8081}

# Supabase PostgreSQL. DATABASE_URL deve ser uma JDBC URL com sslmode=require.
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.pborxjuuexiqollesfxw
spring.datasource.password=ConectaVida_@2121
spring.datasource.driver-class-name=org.postgresql.Driver

# Banco já existente: valida o schema sem executar alterações automáticas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=true

# Java 21
spring.threads.virtual.enabled=true

# O salt precisa ser o MESMO usado pela Admin API, pois ambos compartilham
# a tabela usuarios. Informe-o no ambiente; não gere um salt independente.
app.security.salt=${CONECTA_API_SALT:ConectaVida_SecretSalt_2026_IFSP}
app.security.jwt-secret=ConectaVidaMobileLocalJwt-2026-7f4a91c2b6d8e0a3
app.security.allowed-origins=${CONECTA_MOBILE_CORS_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}

# O módulo mobile não precisa de RabbitMQ para responder aos endpoints.
# Evita que um broker externo seja requisito para iniciar a API do cidadão.
spring.rabbitmq.listener.simple.auto-startup=false

# Health check sem expor detalhes internos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
