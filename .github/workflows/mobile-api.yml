name: Mobile API build

on:
  push:
    branches: [mobile]
  pull_request:
    branches: [mobile]

jobs:
  build-mobile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Mobile API and shared core with the pinned Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :mobile-api:build
