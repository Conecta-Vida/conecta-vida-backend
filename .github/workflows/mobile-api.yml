name: Mobile API build

on:
  push:
    branches: [mobile]
  pull_request:
    branches: [mobile]

jobs:
  build-mobile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Build only mobile-api and shared core
        run: gradle --no-daemon :mobile-api:build
